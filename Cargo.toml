[package]
name = "sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
ai-sdk = { version = "0.1.0", path = "libs/ai-sdk" }
config = { version = "0.15", default-features = false, features = ["toml"] }
reedline = "0.52.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["full"] }
tool = { version = "0.1.0", path = "libs/tool", features = ["macros"] }
