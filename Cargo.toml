[package]
name = "sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
ai-sdk = { version = "0.1.0", path = "libs/ai-sdk" }
config = { version = "0.15", default-features = false, features = ["toml"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.54.0", features = ["full"] }
tool = { version = "0.1.0", path = "libs/tool", features = ["macros"] }
