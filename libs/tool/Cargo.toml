[package]
name = "tool"
version = "0.1.0"
edition = "2024"

[features]
macros = ["dep:tool-macros"]

[dependencies]
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tool-macros = { path = "../tool-macros", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "tool_macro"
required-features = ["macros"]
